<!DOCTYPE html>
<html>
<head>
  <title>AI Auto Quiz</title>
</head>
<body>

<h2>🔥 AI AUTO QUIZ</h2>

<input id="name" placeholder="Enter name">
<button onclick="join()">Start</button>

<hr>

<h3 id="q">Loading...</h3>

<button onclick="answer('A')" id="A"></button>
<button onclick="answer('B')" id="B"></button>
<button onclick="answer('C')" id="C"></button>
<button onclick="answer('D')" id="D"></button>

<h3 id="timer">Timer</h3>
<h3 id="score">Score: 0</h3>

<hr>
<h3>🏆 Leaderboard</h3>
<div id="board"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  databaseURL: "YOUR_DB",
  projectId: "YOUR_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let user="";
let score=0;
let correct="";
let currentQ=1;

// JOIN
function join(){
  user=document.getElementById("name").value;

  db.ref("quiz/currentQuestion").on("value", snap=>{
    currentQ=snap.val();
    loadQuestion(currentQ);
  });

  db.ref("quiz/timer").on("value", snap=>{
    document.getElementById("timer").innerText="Timer: "+snap.val();
  });

  loadBoard();
}

// LOAD QUESTION
function loadQuestion(id){
  db.ref("questions/"+id).once("value", snap=>{
    let q=snap.val();
    if(!q) return;

    document.getElementById("q").innerText=q.q;

    document.getElementById("A").innerText=q.A;
    document.getElementById("B").innerText=q.B;
    document.getElementById("C").innerText=q.C;
    document.getElementById("D").innerText=q.D;

    correct=q.ans;
  });
}

// ANSWER
function answer(opt){
  if(opt===correct){
    score++;
  }

  document.getElementById("score").innerText="Score: "+score;
  db.ref("scores/"+user).set(score);
}

// LEADERBOARD
function loadBoard(){
  db.ref("scores").on("value", snap=>{
    let data=snap.val();
    let arr=[];

    for(let u in data){
      arr.push({user:u, score:data[u]});
    }

    arr.sort((a,b)=>b.score-a.score);

    let html="";
    arr.forEach((d,i)=>{
      html+=`<p>${i+1}. ${d.user} - ${d.score}</p>`;
    });

    document.getElementById("board").innerHTML=html;
  });
}

// 🔥 AUTO SYSTEM (core logic)
setInterval(()=>{
  db.ref("quiz/currentQuestion").once("value", snap=>{
    let n=snap.val()||1;

    // next question
    db.ref("quiz/currentQuestion").set(n+1);

    // reset timer
    db.ref("quiz/timer").set(10);
  });
}, 10000); // every 10 sec new question

// timer countdown
setInterval(()=>{
  db.ref("quiz/timer").once("value", snap=>{
    let t=snap.val()||10;
    if(t>0){
      db.ref("quiz/timer").set(t-1);
    }
  });
},1000);

</script>

</body>
</html>
